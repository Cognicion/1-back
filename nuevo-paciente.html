<!DOCTYPE html>
<html lang="es" data-theme="biocelular">
<head>
<script src="js/theme-preload.js"></script>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/favicon-cognicion.png">
<link rel="stylesheet" href="css/paciente.css?v=20260726-apuntes-layout-v3">

<title>Nuevo paciente</title>

<style>
*{ box-sizing:border-box; }

body{
    margin:0;
    background:
        radial-gradient(circle at top, rgba(78,163,255,0.22), transparent 32%),
        radial-gradient(circle at bottom right, rgba(0,212,255,0.13), transparent 28%),
        linear-gradient(135deg, #050608, #080b10 50%, #0e1520);
    color:#f8fafc;
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
}

.contenedor{
    max-width:1100px;
    margin:auto;
    padding:60px 40px;
}

h1{
    font-size:30px;
    font-weight:800;
}

.tarjeta{
    background:rgba(15, 18, 25, 0.88);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:24px;
    padding:32px;
    margin-bottom:24px;
    box-shadow:0 0 35px rgba(78,163,255,0.10), 0 18px 50px rgba(0,0,0,0.38);
    backdrop-filter:blur(18px);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:22px;
}

label{
    color:#94a3b8;
    display:block;
    margin-bottom:8px;
    font-size:13px;
    font-weight:700;
}

input, select, textarea{
    width:100%;
    padding:11px 12px;
    border-radius:14px;
    border:1px solid rgba(190,196,188,0.25);
    background:rgba(15,23,42,0.95);
    color:white;
    font-size:14px;
}

input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator{
    cursor:pointer;
    filter:invert(1) brightness(2.4);
    opacity:.95;
}

input[type="date"]::-webkit-calendar-picker-indicator:hover,
input[type="time"]::-webkit-calendar-picker-indicator:hover{
    opacity:1;
    filter:invert(1) brightness(3);
}

input[type="time"]::-webkit-datetime-edit-ampm-field{
    display:none;
}

input[type="time"]{
    font-variant-numeric:tabular-nums;
}

.ayuda-campo{
    display:block;
    margin-top:7px;
    color:#7c8da6;
    font-size:12px;
    line-height:1.35;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    margin-top:20px;
    padding:10px 14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg, var(--green-600), var(--green-300));
    color:white;
    cursor:pointer;
    font-weight:700;
}

button:hover{
    box-shadow:0 0 28px rgba(0,212,255,0.28);
}

.input-accion{
    display:flex;
    gap:8px;
}

.input-accion input{
    flex:1;
}

.input-accion button{
    margin-top:0;
    white-space:nowrap;
}

.campo-condicional-oculto{
    display:none !important;
}

.campo-tipo-manual{
    margin-top:10px;
}

.modal-ingreso{
    position:fixed;
    inset:0;
    z-index:80;
    display:grid;
    place-items:center;
    padding:18px;
    background:rgba(2,6,23,0.64);
    backdrop-filter:blur(8px);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
}

.modal-ingreso.abierto{
    opacity:1;
    pointer-events:auto;
}

.panel-ingreso{
    width:min(330px,100%);
    padding:18px;
    border:1px solid rgba(82,152,102,.28);
    border-radius:18px;
    background:rgba(8,12,20,.98);
    box-shadow:0 22px 70px rgba(0,0,0,.44), 0 0 26px rgba(82,152,102,.12);
}

.panel-ingreso-header{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
}

.panel-ingreso-header p{
    margin:0 0 4px;
    color:var(--green-400);
    font-size:10px;
    font-weight:900;
    letter-spacing:.16em;
    text-transform:uppercase;
}

.panel-ingreso-header h3{
    margin:0;
}

.panel-ingreso-header button{
    width:32px;
    height:32px;
    padding:0;
    margin-top:0;
    border-radius:999px;
    background:rgba(15,23,42,.92);
}

.panel-ingreso label{
    margin-top:12px;
}

.panel-ingreso small{
    display:block;
    margin-top:10px;
    color:#7c8da6;
    font-size:12px;
}

.acciones-ingreso{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:16px;
}

.acciones-ingreso button{
    margin-top:0;
}

.selector-hora-clinica{
    display:grid;
    grid-template-columns:minmax(72px,96px) auto minmax(72px,96px) minmax(120px,1fr);
    gap:8px;
    align-items:center;
}

.selector-hora-clinica span{
    color:#d8e6f7;
    font-weight:900;
    text-align:center;
}

.selector-hora-clinica select,
.selector-hora-clinica input{
    width:100%;
    min-height:42px;
}

@media (max-width:640px){
    .selector-hora-clinica{
        grid-template-columns:1fr auto 1fr;
    }

    .selector-hora-clinica input{
        grid-column:1 / -1;
    }
}
</style>
<link rel="stylesheet" href="css/theme/cognicion-theme.css">
<style>
html[data-theme="light"]{
  --nuevo-paciente-text-primary:var(--text-primary,#17211b);
  --nuevo-paciente-text-secondary:var(--text-secondary,#46534b);
  --nuevo-paciente-text-muted:var(--text-muted,#66736b);
  --nuevo-paciente-surface-primary:var(--surface-primary,#fbfcfb);
  --nuevo-paciente-surface-secondary:var(--surface-secondary,#f2f7f3);
  --nuevo-paciente-surface-elevated:var(--surface-elevated,#fff);
  --nuevo-paciente-surface-accent-soft:var(--surface-accent-soft,#e5f1e8);
  --nuevo-paciente-surface-hover:var(--surface-hover,#dcebe1);
  --nuevo-paciente-border-subtle:var(--border-subtle,#ccdacf);
  --nuevo-paciente-border-accent:var(--border-accent,#7da18a);
  --nuevo-paciente-input-background:var(--input-background,#fff);
  --nuevo-paciente-input-text:var(--input-text,#17211b);
  --nuevo-paciente-placeholder-text:var(--placeholder-text,#6b776f);
  --nuevo-paciente-overlay:var(--overlay-background,rgba(18,24,20,.62));
  --nuevo-paciente-warning-bg:var(--warning-background,#f6f1dd);
  --nuevo-paciente-warning-text:var(--warning-text,#574b1e);
  --nuevo-paciente-danger-bg:var(--danger-background,#f8e9e8);
  --nuevo-paciente-danger-text:var(--danger-text,#7a2722);
  --nuevo-paciente-success-bg:var(--success-background,#e4f1e8);
  --nuevo-paciente-success-text:var(--success-text,#245d38);
  color-scheme:light;
}
html[data-theme="light"] body{background:var(--nuevo-paciente-surface-primary);color:var(--nuevo-paciente-text-primary);}
html[data-theme="light"] .contenedor,
html[data-theme="light"] h1,
html[data-theme="light"] h2,
html[data-theme="light"] h3{color:var(--nuevo-paciente-text-primary);}
html[data-theme="light"] .tarjeta{
  background:var(--nuevo-paciente-surface-elevated);
  border-color:var(--nuevo-paciente-border-subtle);
  color:var(--nuevo-paciente-text-primary);
  box-shadow:0 18px 44px rgba(32,70,50,.10);
  backdrop-filter:none;
}
html[data-theme="light"] label{color:var(--nuevo-paciente-text-secondary);opacity:1;}
html[data-theme="light"] input,
html[data-theme="light"] select,
html[data-theme="light"] textarea{
  background:var(--nuevo-paciente-input-background);
  color:var(--nuevo-paciente-input-text);
  border-color:var(--nuevo-paciente-border-subtle);
  opacity:1;
  box-shadow:none;
  -webkit-text-fill-color:var(--nuevo-paciente-input-text);
}
html[data-theme="light"] input::placeholder,
html[data-theme="light"] textarea::placeholder{color:var(--nuevo-paciente-placeholder-text);opacity:1;}
html[data-theme="light"] input:focus,
html[data-theme="light"] select:focus,
html[data-theme="light"] textarea:focus{
  outline:2px solid rgba(125,161,138,.35);
  outline-offset:2px;
  border-color:var(--nuevo-paciente-border-accent);
}
html[data-theme="light"] input[readonly]{background:var(--nuevo-paciente-surface-secondary);color:var(--nuevo-paciente-text-primary);}
html[data-theme="light"] input[type="date"],
html[data-theme="light"] input[type="time"],
html[data-theme="light"] .panel-ingreso input[type="date"],
html[data-theme="light"] .panel-ingreso input[type="time"]{color-scheme:light;}
html[data-theme="light"] input[type="date"]::-webkit-calendar-picker-indicator,
html[data-theme="light"] input[type="time"]::-webkit-calendar-picker-indicator{filter:none;opacity:.78;}
html[data-theme="light"] input[type="date"]::-webkit-calendar-picker-indicator:hover,
html[data-theme="light"] input[type="time"]::-webkit-calendar-picker-indicator:hover{filter:none;opacity:1;}
html[data-theme="light"] select option{background:var(--nuevo-paciente-input-background);color:var(--nuevo-paciente-input-text);}
html[data-theme="light"] .ayuda-campo,
html[data-theme="light"] small{color:var(--nuevo-paciente-text-muted);opacity:1;}
html[data-theme="light"] button{
  background:var(--nuevo-paciente-surface-accent-soft);
  color:#193322;
  border:1px solid var(--nuevo-paciente-border-accent);
  box-shadow:none;
}
html[data-theme="light"] button:hover{background:var(--nuevo-paciente-surface-hover);color:#102418;box-shadow:0 10px 24px rgba(32,70,50,.14);}
html[data-theme="light"] button:focus-visible{outline:2px solid var(--nuevo-paciente-border-accent);outline-offset:2px;}
html[data-theme="light"] button:disabled,
html[data-theme="light"] button[aria-disabled="true"]{
  background:var(--nuevo-paciente-surface-secondary);
  color:var(--nuevo-paciente-text-muted);
  border-color:var(--nuevo-paciente-border-subtle);
  cursor:not-allowed;
  opacity:1;
}
html[data-theme="light"] .modal-ingreso{background:var(--nuevo-paciente-overlay);opacity:0;}
html[data-theme="light"] .modal-ingreso.abierto{opacity:1;}
html[data-theme="light"] .panel-ingreso{
  background:var(--nuevo-paciente-surface-elevated);
  color:var(--nuevo-paciente-text-primary);
  border-color:var(--nuevo-paciente-border-subtle);
  box-shadow:0 22px 70px rgba(18,24,20,.22);
  opacity:1;
}
html[data-theme="light"] .panel-ingreso-header p{color:#2f6d47;opacity:1;}
html[data-theme="light"] .panel-ingreso-header h3{color:var(--nuevo-paciente-text-primary);font-weight:800;}
html[data-theme="light"] .panel-ingreso-header button{
  background:var(--nuevo-paciente-surface-accent-soft);
  color:var(--nuevo-paciente-text-primary);
  border:1px solid var(--nuevo-paciente-border-accent);
}
html[data-theme="light"] .panel-ingreso-header button:hover{background:var(--nuevo-paciente-surface-hover);}
html[data-theme="light"] .panel-ingreso label{color:var(--nuevo-paciente-text-secondary);}
html[data-theme="light"] .panel-ingreso input,
html[data-theme="light"] .panel-ingreso select,
html[data-theme="light"] .panel-ingreso textarea{
  background:var(--nuevo-paciente-input-background);
  color:var(--nuevo-paciente-input-text);
  border-color:var(--nuevo-paciente-border-subtle);
  -webkit-text-fill-color:var(--nuevo-paciente-input-text);
  opacity:1;
}
html[data-theme="light"] .panel-ingreso input::placeholder,
html[data-theme="light"] .panel-ingreso textarea::placeholder{color:var(--nuevo-paciente-placeholder-text);opacity:1;}
html[data-theme="light"] .panel-ingreso small{color:var(--nuevo-paciente-text-muted);opacity:1;}
html[data-theme="light"] .selector-hora-clinica span{color:var(--nuevo-paciente-text-primary);}
html[data-theme="light"] .acciones-ingreso button:first-child{
  background:var(--nuevo-paciente-surface-secondary);
  color:var(--nuevo-paciente-text-primary);
  border-color:var(--nuevo-paciente-border-subtle);
}
html[data-theme="light"] .acciones-ingreso button:last-child{
  background:var(--nuevo-paciente-surface-accent-soft);
  color:#193322;
  border-color:var(--nuevo-paciente-border-accent);
}
html[data-theme="light"] .mensaje-validacion,
html[data-theme="light"] .aviso-validacion,
html[data-theme="light"] .alerta-duplicado,
html[data-theme="light"] .paciente-similar,
html[data-theme="light"] .expediente-duplicado{
  background:var(--nuevo-paciente-warning-bg);
  color:var(--nuevo-paciente-warning-text);
  border:1px solid rgba(185,166,91,.55);
  opacity:1;
}
html[data-theme="light"] .mensaje-error,
html[data-theme="light"] .is-error,
html[data-theme="light"] .error{
  background:var(--nuevo-paciente-danger-bg);
  color:var(--nuevo-paciente-danger-text);
  border-color:rgba(122,39,34,.28);
  opacity:1;
}
html[data-theme="light"] .mensaje-exito,
html[data-theme="light"] .is-success,
html[data-theme="light"] .exito{
  background:var(--nuevo-paciente-success-bg);
  color:var(--nuevo-paciente-success-text);
  border-color:rgba(36,93,56,.28);
  opacity:1;
}
html[data-theme="light"] .panel-ingreso::-webkit-scrollbar{width:10px;}
html[data-theme="light"] .panel-ingreso::-webkit-scrollbar-track{background:var(--nuevo-paciente-surface-secondary);border-radius:999px;}
html[data-theme="light"] .panel-ingreso::-webkit-scrollbar-thumb{background:#9bb6a4;border:2px solid var(--nuevo-paciente-surface-secondary);border-radius:999px;}
html[data-theme="light"] .panel-ingreso::-webkit-scrollbar-thumb:hover{background:#7da18a;}
@media (max-width:640px){
  html[data-theme="light"] .contenedor{padding:32px 18px;}
  html[data-theme="light"] .panel-ingreso{max-height:calc(100vh - 36px);overflow:auto;}
  html[data-theme="light"] .acciones-ingreso{flex-wrap:wrap;}
  html[data-theme="light"] .acciones-ingreso button{flex:1 1 120px;}
}
</style>

<body>

<div class="contenedor">

<h1>Nuevo paciente</h1>

<div class="tarjeta">
<h2>Datos de identificación</h2>

<div class="grid">
    <div>
        <label>Nombre(s)</label>
        <input id="nombresPaciente" placeholder="Nombre(s)">
    </div>

    <div>
        <label>Apellido paterno</label>
        <input id="apellidoPaternoPaciente" placeholder="Apellido paterno">
    </div>

    <div>
        <label>Apellido materno</label>
        <input id="apellidoMaternoPaciente" placeholder="Apellido materno">
    </div>

    <div>
        <label>Alias <small>(opcional)</small></label>
        <input id="aliasPaciente" autocomplete="nickname" placeholder="Alias o nombre preferido">
    </div>

    <input id="nombre" type="hidden">

    <div>
        <label>Fecha de nacimiento</label>
        <input id="fechaNacimiento" type="date">
    </div>

    <div>
        <label>Edad</label>
        <input id="edadManual" type="number" min="0" max="130" placeholder="Se calcula automaticamente">
        <small id="ayudaEdad" class="ayuda-campo">Si no hay fecha de nacimiento, puedes escribirla manualmente.</small>
    </div>

    <div>
        <label>Sexo</label>
        <select id="sexo">
            <option value="">Seleccionar</option>
            <option value="Hombre">Hombre</option>
            <option value="Mujer">Mujer</option>
            <option value="Prefiero no decirlo">Prefiero no decirlo</option>
        </select>
    </div>

    <div>
        <label>Genero</label>
        <input id="genero" placeholder="Ej. Femenino-CIS">
    </div>

    <div>
        <label>CURP</label>
        <input id="curp">
    </div>

    <div>
        <label>Teléfono</label>
        <input id="telefono">
    </div>

    <div>
        <label>Correo electrónico</label>
        <input id="email" type="email">
    </div>

    <div>
        <label>Estado civil</label>
        <input id="estadoCivil">
    </div>

    <div>
        <label>Escolaridad</label>
        <input id="escolaridad">
    </div>

    <div>
        <label>Ocupación</label>
        <input id="ocupacion">
    </div>

    <div>
        <label>Tipo de paciente</label>
        <select id="tipoPaciente">
            <option value="privada">Privado</option>
            <option value="institucion">Institucional</option>
            <option value="clinica">Clinica</option>
            <option value="otro">Otro...</option>
        </select>
        <input id="tipoPacienteManual" class="campo-tipo-manual campo-condicional-oculto" placeholder="Especificar tipo de paciente">
    </div>

    <div class="campo-institucional-nuevo">
        <label>Institucion</label>
        <input id="institucionPaciente" placeholder="Ej. Hospital Psiquiatrico Fray Bernardino Alvarez">
    </div>

    <div class="campo-institucional-nuevo">
        <label>Servicio institucional</label>
        <input id="servicioInstitucional" placeholder="Ej. Observacion">
    </div>

    <div class="campo-institucional-nuevo">
        <label>Expediente institucional</label>
        <input id="expediente">
    </div>

    <div class="campo-institucional-nuevo">
        <label>Cama</label>
        <input id="cama">
    </div>

    <div class="campo-institucional-nuevo">
        <label>Fecha y hora de ingreso</label>
        <div class="input-accion">
            <input id="fechaIngreso" placeholder="DD/MM/AAAA HH:mm" readonly>
            <button type="button" id="abrirIngresoNuevo">Elegir</button>
        </div>
    </div>

    <div>
        <label>Alergias</label>
        <input id="alergias" placeholder="Negadas, no conocidas o especificar">
    </div>

    <div>
        <label>Tipo de sangre</label>
        <input id="tipoSangre" placeholder="Ej. O+, A-, AB+">
    </div>

    <div>
        <label>Peso</label>
        <input id="peso" type="number" min="0" step="0.1" placeholder="kg">
    </div>

    <div>
        <label>Talla</label>
        <input id="talla" type="number" min="0" step="0.01" placeholder="m">
    </div>

    <div>
        <label>IMC</label>
        <input id="imc" placeholder="Se calcula automaticamente" readonly>
    </div>

    <div>
        <label>Perimetro abdominal</label>
        <input id="perimetroAbdominal" type="number" min="0" step="0.1" placeholder="cm">
    </div>

    <div>
        <label>Estancia manual / observacion</label>
        <input id="diasEstancia" placeholder="Opcional, el conteo se calcula desde ingreso">
    </div>
</div>
</div>

<div class="tarjeta">
<h2>Información clínica inicial</h2>

<div class="grid">
    <div>
        <label>Médico tratante</label>
        <input id="medicoTratante" placeholder="Se tomará de tu perfil profesional">
    </div>

    <div>
        <label>Diagnóstico principal</label>
        <input id="diagnosticoTextoInicial">
    </div>

    <div>
        <label>Última consulta</label>
        <input id="ultimaConsulta" type="date">
    </div>
</div>

<br>

<label>Tratamiento actual</label>
<textarea id="tratamientoTextoInicial"></textarea>

<br><br>

<div class="form-actions">
  <button type="button" class="boton-secundario" onclick="mostrarDiagnosticosNuevoPaciente()">DiagnÃ³sticos</button>
  <button type="button" class="boton-secundario" onclick="mostrarTratamientoNuevoPaciente()">Tratamiento e indicaciones</button>
</div>
<div id="clinicaNuevoPacienteHost"></div>

<label>Observaciones</label>
<textarea id="observaciones"></textarea>

<button onclick="guardarPacienteNuevo()">
Guardar paciente
</button>

</div>

</div>

<div id="modalIngresoNuevo" class="modal-ingreso" aria-hidden="true">
    <div class="panel-ingreso" role="dialog" aria-modal="true" aria-labelledby="tituloIngresoNuevo">
        <div class="panel-ingreso-header">
            <div>
                <p>Fecha de ingreso</p>
                <h3 id="tituloIngresoNuevo">Seleccionar ingreso</h3>
            </div>
            <button type="button" id="cerrarIngresoNuevo" aria-label="Cerrar selector">×</button>
        </div>

        <label>Dia
            <input id="ingresoNuevoFecha" type="date">
        </label>

          <label>Hora
              <div class="selector-hora-clinica">
                  <select id="ingresoNuevoHoraHH" aria-label="Hora"></select>
                  <span>:</span>
                  <select id="ingresoNuevoHoraMM" aria-label="Minuto"></select>
                  <input id="ingresoNuevoHoraManual" type="text" inputmode="numeric" placeholder="HH:mm" aria-label="Hora manual">
                  <input id="ingresoNuevoHora" type="hidden">
              </div>
          </label>

        <small>Si no seleccionas hora, se tomara el inicio del dia.</small>

        <div class="acciones-ingreso">
            <button type="button" id="limpiarIngresoNuevo">Limpiar</button>
            <button type="button" id="guardarIngresoNuevo">Aplicar</button>
        </div>
    </div>
</div>

<script type="module" src="js/nuevoPaciente.js?v=20260814-patient-alias-v1"></script>

  <script type="module" src="js/components/accesosRapidos.js"></script>
  <script type="module" src="js/reportes.js"></script>
</body>
</html>
