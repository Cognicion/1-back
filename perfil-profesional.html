<!DOCTYPE html>
<html lang="es" data-theme="biocelular">
<head>
<script src="js/theme-preload.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil profesional | Cognicion</title>
<link rel="icon" type="image/png" href="assets/favicon-cognicion.png">
<link rel="stylesheet" href="css/perfil-profesional.css?v=1.866-profile-photo-v1">
<link rel="stylesheet" href="css/theme/cognicion-theme.css">
<script type="module" src="js/services/themeBootstrap.js"></script>
</head>
<body class="bloqueado">
<header class="header">
  <div class="marca">
    <img src="assets/favicon-cognicion.png" alt="Cognicion">
    <div>
      <h1>Perfil profesional</h1>
      <p>Tarjeta de presentacion, fotografia, cedulas y contacto.</p>
    </div>
  </div>
  <nav>
    <button onclick="window.location.href='dashboard.html'">Inicio</button>
    <button onclick="window.location.href='medico.html'">Panel medico</button>
  </nav>
</header>

<main class="layout">
  <section class="card">
    <h2>Datos profesionales</h2>
    <form id="formPerfil" class="formulario">
      <label>Nombre profesional
        <input id="nombrePerfil" required>
      </label>
      <div class="campo-amplio foto-perfil-editor" aria-labelledby="tituloFotoPerfil">
        <div class="foto foto-editor" id="fotoPerfilEditor" aria-hidden="true">DR</div>
        <div class="foto-perfil-controles">
          <strong id="tituloFotoPerfil">Fotografía de perfil</strong>
          <p>Selecciona una imagen JPG, PNG o WEBP de hasta 5 MB.</p>
          <input id="archivoFotoPerfil" type="file" accept="image/jpeg,image/png,image/webp" disabled>
          <input id="fotoPerfil" type="hidden">
          <p id="estadoFotoPerfil" class="estado-foto" role="status" aria-live="polite"></p>
        </div>
      </div>
      <label>Especialidad
        <input id="especialidadPerfil" placeholder="Psiquiatria, Psicologia clinica, Medicina interna...">
      </label>
      <label>Institucion
        <input id="institucionPerfil" placeholder="Hospital, clinica o consulta">
      </label>
      <label>Cedula profesional
        <input id="cedulaPerfil">
      </label>
      <label>Cedula de especialidad
        <input id="cedulaEspecialidadPerfil">
      </label>
      <label>Telefono de contacto
        <input id="telefonoPerfil">
      </label>
      <label>Correo de contacto
        <input id="correoPerfil" type="email">
      </label>
      <label class="campo-amplio">Descripcion breve
        <textarea id="descripcionPerfil" placeholder="Enfoque clinico, poblacion que atiende, areas de interes"></textarea>
      </label>
      <button type="submit">Guardar perfil</button>
    </form>
  </section>

  <section class="card tarjeta-preview">
    <h2>Tarjeta de presentacion</h2>
    <div class="tarjeta-medico">
      <div class="foto" id="fotoPreview">DR</div>
      <div>
        <h3 id="nombrePreview">Cargando...</h3>
        <p id="especialidadPreview">Especialidad</p>
        <div class="linea"><span>Institucion</span><strong id="institucionPreview">---</strong></div>
        <div class="linea"><span>Cedula</span><strong id="cedulaPreview">---</strong></div>
        <div class="linea"><span>Contacto</span><strong id="contactoPreview">---</strong></div>
        <p id="descripcionPreview" class="descripcion"></p>
      </div>
    </div>
  </section>
</main>

<script type="module" src="js/perfil-profesional.js?v=20260811-profile-photo-storage-guard-v2"></script>
  <script type="module" src="js/components/accesosRapidos.js"></script>
  <script type="module" src="js/reportes.js"></script>
</body>
</html>
