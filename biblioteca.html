<!DOCTYPE html>
<html lang="es" data-theme="biocelular">
<head>
<script src="js/theme-preload.js?v=2.115-navbar-unica-v2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca clínica | Cognición</title>
<link rel="icon" type="image/png" href="assets/favicon-cognicion.png">
<link rel="stylesheet" href="css/biblioteca.css?v=1.882-biblioteca-publica-v1">
<link rel="stylesheet" href="css/theme/cognicion-theme.css">
<script type="module" src="js/services/themeBootstrap.js"></script>
</head>
<body class="bloqueado">
<header class="header">
  <div class="marca">
    <img src="assets/favicon-cognicion.png" alt="Cognicion">
    <div>
      <h1>Biblioteca clínica</h1>
    <p>Vademécum, diagnósticos CIE y criterios orientativos.</p>
    </div>
  </div>
  <nav id="navegacionBibliotecaPrivada">
    <button onclick="window.location.href='medico.html'">Panel medico</button>
    <button onclick="window.location.href='dashboard.html'">Inicio</button>
  </nav>
  <nav id="navegacionBibliotecaPublica" class="navegacion-biblioteca-publica" hidden>
    <span class="insignia-consulta-publica">Consulta pública</span>
    <button type="button" onclick="window.location.href='index.html'">Volver al inicio</button>
    <button type="button" onclick="window.location.href='login.html'">Iniciar sesión</button>
  </nav>
</header>

<main class="layout" data-library-root>
  <section class="card buscador">
    <input id="buscadorBiblioteca" placeholder="Buscar diagnóstico, medicamento o criterio...">
    <select id="grupoCie10Biblioteca" class="filtro-cie10" aria-label="Filtrar diagnósticos CIE-10 por grupo">
      <option value="todos">Mostrar: todos los CIE-10</option>
    </select>
    <select id="categoriaBiblioteca" class="filtro-categoria-biblioteca" aria-label="Filtrar por categoría">
      <option value="todas">Mostrar: todas las categorías</option>
    </select>
    <fieldset class="filtro-sistemas-biblioteca">
      <legend>Sistemas diagnósticos visibles</legend>
      <div id="sistemasDiagnosticosBiblioteca" class="sistemas-diagnosticos-controles"></div>
    </fieldset>
  </section>


  <section class="tabs">
  <button data-tab="diagnosticos" class="activo">Diagnósticos</button>
  <button data-tab="vademecum">Vademécum</button>
  <button data-tab="citocromos">Citocromos CYP</button>
  <button type="button" onclick="window.location.href='quiz_examen_consejo.html'">
    Quiz de Consejo
  </button>
</section>


  <section id="panelBiblioteca" class="grid"></section>
</main>

  <script type="module" src="js/biblioteca.js?v=2.096-psicoeducacion-retirada"></script>
  <script type="module" src="js/components/accesosRapidos.js"></script>
  <script type="module" src="js/reportes.js"></script>
</body>
</html>
